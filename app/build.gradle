plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'com.example.mango'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mango"
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk{
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "armeabi", "armeabi-v7a", "arm64-v8a", "x86","arm64-v8a","x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.amap.api:3dmap:8.1.0' //3D地图
    implementation 'com.amap.api:search:7.7.0' //搜索功能
    implementation 'com.amap.api:location:5.2.0' //定位功能
    //Google推荐的EasyPermission库
    implementation 'pub.devrel:easypermissions:3.0.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}